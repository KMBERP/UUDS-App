name: Build UUDS Parts Inspection APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold native Android project
        run: flutter create --platforms=android --org com.uudsaero --project-name uuds_parts_app scaffold_tmp

      - name: Copy app source into scaffold
        run: |
          rm -rf scaffold_tmp/lib
          cp -r source/lib scaffold_tmp/lib
          rm -rf scaffold_tmp/assets
          cp -r source/assets scaffold_tmp/assets
          cp source/pubspec.yaml scaffold_tmp/pubspec.yaml

      - name: Copy release signing keystore into scaffold
        run: |
          # Without this, `flutter build apk --release` falls back to signing
          # with a random debug key that's regenerated on every CI run - so
          # every build looks like a "different app" to Android, and it
          # refuses to install over the existing one (needs uninstall first).
          # Using the same committed keystore every time fixes that: Android
          # sees the same signing certificate and updates in place.
          cp signing/uuds-release.keystore.jks scaffold_tmp/android/app/uuds-release.keystore.jks
          cp signing/key.properties scaffold_tmp/android/key.properties

      - name: Stamp real build ID into the app (for on-device verification)
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="${SHORT_SHA}-run${{ github.run_number }}"
          echo "Stamping build ID: $BUILD_ID"
          cat > scaffold_tmp/lib/utils/build_info.dart << EOF
          /// Auto-generated by the CI workflow for this specific build - see
          /// build-apk.yml "Stamp real build ID" step. If the app shows
          /// "dev-build (uninjected)" instead of a value like this, it did
          /// NOT come from this pipeline.
          const String kBuildId = '$BUILD_ID';
          EOF
          cat scaffold_tmp/lib/utils/build_info.dart

      - name: Add camera + storage permissions, app label
        run: |
          MANIFEST=scaffold_tmp/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <application#' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="UUDS Parts Inspection"/' "$MANIFEST"

          # Android 11+ (targetSdk 30+) hides other apps from this app's view
          # by default ("package visibility") - including from
          # canLaunchUrl()/PackageManager queries. Without declaring which
          # intents this app needs to see, canLaunchUrl(mailto:...) reports
          # false even when a mail app (e.g. Outlook) genuinely is
          # installed, which is exactly the "No email app found" error.
          # IMPORTANT: url_launcher's canLaunchUrl queries mailto: links
          # with ACTION_VIEW (not ACTION_SENDTO) on Android - that's the
          # one that actually has to be declared, confirmed against the
          # plugin's own docs. SENDTO is included too since share_plus/other
          # flows may use it, but VIEW is the one this bug needed.
          # <queries> must be a sibling of <application>, inside <manifest>.
          sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="mailto" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.SENDTO" />\n            <data android:scheme="mailto" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.SEND" />\n            <data android:mimeType="*/*" />\n        </intent>\n    </queries>\n</manifest>#' "$MANIFEST"

          if ! grep -q 'android.intent.action.VIEW' "$MANIFEST"; then
            echo "::error::<queries> block for mailto (ACTION_VIEW) was not inserted into AndroidManifest.xml - email launching would silently fail"
            exit 1
          fi
          echo "OK: mailto <queries> declaration (ACTION_VIEW) confirmed present"

      - name: Add native MediaStore publish channel (MainActivity)
        run: |
          set -e
          EXISTING=$(find scaffold_tmp/android/app/src/main -type f -name "MainActivity.*" | head -n1)
          if [ -z "$EXISTING" ]; then
            echo "::error::flutter create did not generate a MainActivity.kt/.java - cannot inject the photo_store channel"
            find scaffold_tmp/android/app/src/main -maxdepth 5
            exit 1
          fi
          echo "Found existing MainActivity at: $EXISTING (this will be replaced)"
          MAIN_ACT_DIR=$(dirname "$EXISTING")
          rm -f "$EXISTING"
          mkdir -p "$MAIN_ACT_DIR"
          cat > "$MAIN_ACT_DIR/MainActivity.kt" << 'KOTLIN_EOF'
          package com.uudsaero.uuds_parts_app

          import android.content.ContentValues
          import android.media.MediaScannerConnection
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.view.KeyEvent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileInputStream

          /**
           * Mirrors a photo the app already saved privately into the device's
           * public Gallery, nested as Pictures/UUDS/<Aircraft>/<InspectionType>/
           * <Location>/<fileName>, using the MediaStore API on Android 10+ and a
           * direct public-folder write (with a media-scan) on Android 9 and
           * below. Neither path needs the broad "All files access" permission.
           * Returns a {success, error} map so the Dart side can show the real
           * reason if publishing ever fails, instead of a bare boolean.
           *
           * Also forwards the hardware camera button (KEYCODE_CAMERA - the
           * dedicated side key some rugged tablets like the Galaxy Tab
           * Active3 have) to Dart over a separate channel, since Flutter
           * doesn't surface that key on its own.
           */
          class MainActivity : FlutterActivity() {
              private val CHANNEL = "uuds/photo_store"
              private val HARDWARE_KEYS_CHANNEL = "uuds/hardware_keys"
              private var hardwareKeysMethodChannel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "publishToGallery") {
                          try {
                              val sourcePath = call.argument<String>("sourcePath")!!
                              val aircraft = call.argument<String>("aircraft") ?: "Unknown"
                              val type = call.argument<String>("type") ?: "Unknown"
                              val location = call.argument<String>("location") ?: "Unknown"
                              val fileName = call.argument<String>("fileName")!!
                              result.success(publishToGallery(sourcePath, aircraft, type, location, fileName))
                          } catch (e: Exception) {
                              result.success(mapOf("success" to false, "error" to (e.message ?: e.toString())))
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
                  hardwareKeysMethodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, HARDWARE_KEYS_CHANNEL)
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode == KeyEvent.KEYCODE_CAMERA && event.action == KeyEvent.ACTION_DOWN && event.repeatCount == 0) {
                      hardwareKeysMethodChannel?.invokeMethod("cameraButtonPressed", null)
                      // Consume it so Android doesn't also try to launch a
                      // separate system camera app on top of ours.
                      return true
                  }
                  return super.dispatchKeyEvent(event)
              }

              private fun publishToGallery(
                  sourcePath: String,
                  aircraft: String,
                  type: String,
                  location: String,
                  fileName: String
              ): Map<String, Any?> {
                  val source = File(sourcePath)
                  if (!source.exists()) {
                      return mapOf("success" to false, "error" to "Source file missing: $sourcePath")
                  }

                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          // Trailing slash matters here - MediaStore can silently
                          // misplace the file into the wrong (or a flat) folder
                          // on some OEM builds if it's omitted.
                          val relativePath = "Pictures/UUDS/$aircraft/$type/$location/"
                          val values = ContentValues().apply {
                              put(MediaStore.Images.Media.DISPLAY_NAME, fileName)
                              put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                              put(MediaStore.Images.Media.RELATIVE_PATH, relativePath)
                              put(MediaStore.Images.Media.IS_PENDING, 1)
                          }
                          val resolver = applicationContext.contentResolver
                          val uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                              ?: return mapOf("success" to false, "error" to "MediaStore insert() returned null")

                          val stream = resolver.openOutputStream(uri)
                          if (stream == null) {
                              resolver.delete(uri, null, null)
                              return mapOf("success" to false, "error" to "openOutputStream() returned null")
                          }
                          stream.use { out -> FileInputStream(source).use { input -> input.copyTo(out) } }

                          val doneValues = ContentValues()
                          doneValues.put(MediaStore.Images.Media.IS_PENDING, 0)
                          resolver.update(uri, doneValues, null, null)
                          mapOf("success" to true, "error" to null)
                      } else {
                          val dir = File(
                              Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES),
                              "UUDS/$aircraft/$type/$location"
                          )
                          if (!dir.exists()) dir.mkdirs()
                          val dest = File(dir, fileName)
                          FileInputStream(source).use { input ->
                              dest.outputStream().use { output -> input.copyTo(output) }
                          }
                          MediaScannerConnection.scanFile(applicationContext, arrayOf(dest.absolutePath), null, null)
                          mapOf("success" to true, "error" to null)
                      }
                  } catch (e: Exception) {
                      mapOf("success" to false, "error" to (e.message ?: e.toString()))
                  }
              }
          }
          KOTLIN_EOF
          echo "----- MainActivity.kt written to $MAIN_ACT_DIR -----"
          test -f "$MAIN_ACT_DIR/MainActivity.kt" && wc -l "$MAIN_ACT_DIR/MainActivity.kt"
          if ! grep -q 'uuds/photo_store' "$MAIN_ACT_DIR/MainActivity.kt"; then
            echo "::error::MainActivity.kt was written but does not contain the uuds/photo_store channel - refusing to build a broken APK"
            exit 1
          fi
          if ! grep -q 'uuds/hardware_keys' "$MAIN_ACT_DIR/MainActivity.kt"; then
            echo "::error::MainActivity.kt was written but does not contain the uuds/hardware_keys channel - the hardware camera button would silently not work"
            exit 1
          fi
          if ! grep -q 'package com.uudsaero.uuds_parts_app' "$MAIN_ACT_DIR/MainActivity.kt"; then
            echo "::error::MainActivity.kt package does not match com.uudsaero.uuds_parts_app - the manifest's activity won't resolve to this class"
            exit 1
          fi
          echo "OK: photo_store channel confirmed present in MainActivity.kt"
          echo "----- MainActivity.kt written to $MAIN_ACT_DIR -----"
          test -f "$MAIN_ACT_DIR/MainActivity.kt" && wc -l "$MAIN_ACT_DIR/MainActivity.kt"

      - name: Force compileSdk/targetSdk 36 (fixes plugin AAR metadata requirements)
        run: |
          for GRADLE_FILE in scaffold_tmp/android/app/build.gradle.kts scaffold_tmp/android/app/build.gradle; do
            if [ -f "$GRADLE_FILE" ]; then
              sed -i 's/flutter\.compileSdkVersion/36/' "$GRADLE_FILE"
              sed -i 's/flutter\.targetSdkVersion/36/' "$GRADLE_FILE"
              sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' "$GRADLE_FILE"
              sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/' "$GRADLE_FILE"
            fi
          done

      - name: Configure release signing (use our permanent keystore, not the throwaway debug one)
        run: |
          python3 << 'PYEOF'
          import re

          kts = "scaffold_tmp/android/app/build.gradle.kts"
          groovy = "scaffold_tmp/android/app/build.gradle"

          def patch_kts(path):
              with open(path) as f:
                  text = f.read()

              text = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + text

              loader = (
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              text = text.replace("android {", loader + "android {", 1)

              signing_block = (
                  'android {\n'
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String?\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String?\n'
                  '            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n'
                  '            storePassword = keystoreProperties["storePassword"] as String?\n'
                  '        }\n'
                  '    }\n'
              )
              text = text.replace("android {", signing_block, 1)

              text = text.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')

              with open(path, "w") as f:
                  f.write(text)
              print(f"Patched {path} for release signing (Kotlin DSL)")

          def patch_groovy(path):
              with open(path) as f:
                  text = f.read()

              loader = (
                  "def keystoreProperties = new Properties()\n"
                  "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              text = text.replace("android {", loader + "android {", 1)

              signing_block = (
                  "android {\n"
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  "        }\n"
                  "    }\n"
              )
              text = text.replace("android {", signing_block, 1)

              text = re.sub(r'signingConfigs\.getByName\("debug"\)', 'signingConfigs.getByName("release")', text)
              text = re.sub(r'signingConfigs\.debug\b', 'signingConfigs.release', text)

              with open(path, "w") as f:
                  f.write(text)
              print(f"Patched {path} for release signing (Groovy)")

          import os
          if os.path.exists(kts):
              patch_kts(kts)
          elif os.path.exists(groovy):
              patch_groovy(groovy)
          else:
              raise SystemExit("::error::No app/build.gradle(.kts) found - cannot configure release signing")
          PYEOF

      - name: Verify release signing config was applied
        run: |
          GRADLE_FILE=scaffold_tmp/android/app/build.gradle.kts
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE=scaffold_tmp/android/app/build.gradle
          if ! grep -q 'signingConfigs.getByName("release")\|signingConfigs.release' "$GRADLE_FILE"; then
            echo "::error::Release signing config was not wired up - refusing to build an APK that would sign with a throwaway debug key"
            exit 1
          fi
          echo "OK: release build type is wired to the permanent keystore"

      - name: Get packages
        working-directory: scaffold_tmp
        run: flutter pub get

      - name: Force compileSdk 36 on every downloaded plugin (fixes AAR metadata requirements)
        run: |
          find "$HOME/.pub-cache" -path "*/android/build.gradle*" -print0 2>/dev/null | \
          xargs -0 -r sed -i \
            -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' \
            -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' \
            -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/' \
            -e 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 36/' \
            -e 's/compileSdk = [0-9][0-9]*/compileSdk = 36/'

      - name: Generate app icon from logo
        working-directory: scaffold_tmp
        run: dart run flutter_launcher_icons

      - name: Add ProGuard rules for ML Kit text recognition (fixes runtime NullPointerException)
        run: |
          PROGUARD_FILE=scaffold_tmp/android/app/proguard-rules.pro
          touch "$PROGUARD_FILE"
          cat >> "$PROGUARD_FILE" << 'EOF'

          # Keep all ML Kit vision/text classes so R8 doesn't strip anything
          # the plugin needs reflectively at runtime (this fixes a
          # NullPointerException crash when the recognizer initializes).
          -keep class com.google.mlkit.** { *; }
          -keep class com.google_mlkit_text_recognition.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_text_common.** { *; }
          -dontwarn com.google.mlkit.**
          EOF

      - name: Build release APK
        working-directory: scaffold_tmp
        run: flutter build apk --release

      - name: Verify the built APK is actually signed with our permanent keystore
        run: |
          set -e
          STORE_PASS=$(grep '^storePassword=' signing/key.properties | cut -d= -f2-)
          echo "--- Our keystore's own certificate fingerprint ---"
          KEYSTORE_FP=$(keytool -list -v -keystore signing/uuds-release.keystore.jks -storepass "$STORE_PASS" -alias uuds_upload | grep 'SHA256:' | head -n1)
          echo "$KEYSTORE_FP"
          echo "--- The actual built APK's signing certificate fingerprint ---"
          APK_FP=$(keytool -printcert -jarfile scaffold_tmp/build/app/outputs/flutter-apk/app-release.apk | grep 'SHA256:' | head -n1)
          echo "$APK_FP"
          if [ "$KEYSTORE_FP" != "$APK_FP" ]; then
            echo "::error::The built APK's signature does NOT match signing/uuds-release.keystore.jks - it would fail to update over a build that used the permanent key. Refusing to publish this APK."
            exit 1
          fi
          echo "OK: confirmed - this APK is signed with the permanent keystore and will update cleanly over any other build signed with it."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UUDS-Parts-Inspection-APK
          path: scaffold_tmp/build/app/outputs/flutter-apk/app-release.apk
